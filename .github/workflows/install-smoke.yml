name: Install Smoke Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  windows-install-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run automated install + smoke test
        shell: cmd
        run: |
          if exist .venv_test rmdir /s /q .venv_test
          python -m venv .venv_test
          call .venv_test\Scripts\activate.bat
          python -m pip install --upgrade pip >nul 2>&1
          pip install -r requirements.txt --no-cache-dir
          python networks.py --smoke-test
          call deactivate
          rmdir /s /q .venv_test
