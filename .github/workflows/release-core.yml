name: Release Core

on:
  push:
    branches:
      - stable
    paths-ignore:
      - "plugins/**"
      - "docs/plugins/**"
      - "plugin_catalog.json"
      - "config/plugin_catalog_cache.json"
      - "config/plugins.json"
  workflow_dispatch:
    inputs:
      bump_type:
        description: "Version bump type"
        required: false
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: write   # Required for gh workflow run to trigger Release Windows Zip

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine bump type
        id: bump
        run: |
          BUMP="${{ github.event.inputs.bump_type }}"
          if [ -z "$BUMP" ]; then
            BUMP="patch"
          fi
          echo "bump_type=$BUMP" >> $GITHUB_OUTPUT

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.bump_type }}
        run: |
          NEW_VERSION=$(python scripts/bump_version.py ${{ steps.bump.outputs.bump_type }})
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No version changes (may already be bumped)"
            exit 0
          fi
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin ${{ github.ref_name }}

      - name: Create and push tag
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping push"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Trigger release build
        run: |
          gh workflow run "Release Windows Zip" --ref ${{ steps.tag.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
