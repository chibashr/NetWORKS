name: Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to manifest.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable folder
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --no-cache-dir
          python -m pip install "pyinstaller>=6.10.0" --no-cache-dir
          if exist dist rmdir /s /q dist
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --onedir ^
            --name NetWORKS ^
            --noconsole ^
            --distpath dist\portable ^
            --add-data "manifest.json;." ^
            --add-data "config;config" ^
            --add-data "plugins;plugins" ^
            --collect-all PySide6 ^
            --collect-all qtpy ^
            --collect-all qtawesome ^
            networks.py

      - name: Build installer EXE
        shell: cmd
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --onefile ^
            --name NetWORKS ^
            --noconsole ^
            --distpath dist ^
            --add-data "manifest.json;." ^
            --add-data "config;config" ^
            --add-data "plugins;plugins" ^
            --collect-all PySide6 ^
            --collect-all qtpy ^
            --collect-all qtawesome ^
            networks.py

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $manifest = Get-Content -Raw -Path "manifest.json" | ConvertFrom-Json
            $inputVersion = $manifest.version
          }
          $version = $inputVersion.Trim()
          if ($version.StartsWith("v")) {
            $tag = $version
            $version = $version.Substring(1)
          } else {
            $tag = "v$version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare release notes
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -Path "manifest.json" | ConvertFrom-Json
          $notes = $manifest.release_notes
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Release ${{ steps.version.outputs.tag }}."
          }
          $notes | Out-File -FilePath "release_notes.md" -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          iscc /DMyAppVersion=$version /DMyAppName=NetWORKS /DMyAppPublisher=chibashr /DMyAppURL=https://github.com/networks/networks /DMyAppExeName=NetWORKS.exe packaging\windows_installer.iss

      - name: Package artifacts
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $portableZip = "dist\NetWORKS-Portable-$env:RELEASE_VERSION.zip"
          $installer = "dist\NetWORKS-Setup-$env:RELEASE_VERSION.exe"
          if (Test-Path $portableZip) { Remove-Item $portableZip -Force }
          Compress-Archive -Path "dist\portable\NetWORKS" -DestinationPath $portableZip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetWORKS-windows
          path: |
            dist/NetWORKS-Portable-${{ steps.version.outputs.version }}.zip
            dist/NetWORKS-Setup-${{ steps.version.outputs.version }}.exe
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
          files: |
            dist/NetWORKS-Portable-${{ steps.version.outputs.version }}.zip
            dist/NetWORKS-Setup-${{ steps.version.outputs.version }}.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: NetWORKS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          body_path: release_notes.md
