name: Release Windows Zip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (defaults to manifest.json)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $inputVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($inputVersion)) {
            $manifest = Get-Content -Raw -Path "manifest.json" | ConvertFrom-Json
            $inputVersion = $manifest.version
          }
          $version = $inputVersion.Trim()
          if ($version.StartsWith("v")) {
            $tag = $version
            $version = $version.Substring(1)
          } else {
            $tag = "v$version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Prepare release notes
        shell: pwsh
        run: |
          $manifest = Get-Content -Raw -Path "manifest.json" | ConvertFrom-Json
          $notes = $manifest.release_notes
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Release ${{ steps.version.outputs.tag }}."
          }
          # Add automatic update information
          $notes += "`n`n---`n`n**Automatic Updates:** This release supports automatic updates via Git. When you extract the zip and run NetWORKS, the update system will automatically initialize a Git repository on first update, enabling seamless future updates."
          $notes | Out-File -FilePath "release_notes.md" -Encoding utf8

      - name: Package repository zip (core)
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $zip = "dist\NetWORKS-Repo-$env:RELEASE_VERSION.zip"
          $staging = "dist\NetWORKS"
          $exclude = @(".git", "dist", ".venv", ".venv_test", "__pycache__", "build")
          if (Test-Path "dist") { Remove-Item "dist" -Recurse -Force }
          New-Item -ItemType Directory -Path $staging | Out-Null
          Get-ChildItem -Path "." -Force |
            Where-Object { $exclude -notcontains $_.Name } |
            ForEach-Object { Copy-Item -Path $_.FullName -Destination $staging -Recurse -Force }
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $staging -DestinationPath $zip -Force

      - name: Build plugin packages
        run: python scripts/build_plugin_package.py --all

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetWORKS-windows
          path: dist/NetWORKS-Repo-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_TOKEN != '' && secrets.RELEASE_TOKEN || github.token }}
          files: |
            dist/NetWORKS-Repo-${{ steps.version.outputs.version }}.zip
            dist/plugins/*.zip
          fail_on_unmatched_files: false
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          name: NetWORKS ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.version.outputs.tag }}
          body_path: release_notes.md
