name: Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build portable EXE
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --no-cache-dir
          python -m pip install "pyinstaller>=6.10.0" --no-cache-dir
          if exist dist rmdir /s /q dist
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --onedir ^
            --name NetWORKS ^
            --noconsole ^
            --add-data "manifest.json;." ^
            --add-data "config;config" ^
            --add-data "plugins;plugins" ^
            --collect-all PySide6 ^
            --collect-all qtpy ^
            --collect-all qtawesome ^
            networks.py

      - name: Package artifact
        shell: pwsh
        run: |
          Compress-Archive -Path dist\NetWORKS\* -DestinationPath dist\NetWORKS-windows.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetWORKS-windows
          path: dist/NetWORKS-windows.zip
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NetWORKS-windows.zip
          name: NetWORKS ${{ github.ref_name }}
          generate_release_notes: true
